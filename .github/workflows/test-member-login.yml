name: Test member login
on:
  pull_request:
    paths:
      - 'member_auth/**'
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - '.github/workflows/test-member-login.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r member_auth/requirements.txt
      - run: python -m unittest discover -s tests -v

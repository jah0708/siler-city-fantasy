name: Verify site password without disclosure
on:
  push:
    branches: ['diagnostic/site-password-20261112']
    paths: ['.github/workflows/verify-site-password.yml']
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare public encrypted payload
        run: |
          python -m pip install 'cryptography==46.0.4'
          python - <<'PY'
          import urllib.request
          from pathlib import Path
          url = 'https://jah0708.github.io/siler-city-fantasy/data/league-data.enc.json'
          with urllib.request.urlopen(url, timeout=30) as response:
              Path('/tmp/site-payload.json').write_bytes(response.read())
          PY
      - name: Check password internally
        env:
          SCFL_SITE_PASSWORD: ${{ secrets.SCFL_SITE_PASSWORD }}
        run: |
          python - <<'PY'
          import os, json, hashlib, base64
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          password = os.environ.get('SCFL_SITE_PASSWORD','')
          if not password:
              print('SITE_PASSWORD_MISSING')
              raise SystemExit(0)
          payload = json.loads(Path('/tmp/site-payload.json').read_text())
          print('SITE_PASSWORD_MIN_LENGTH_OK' if len(password)>=20 else 'SITE_PASSWORD_TOO_SHORT')
          try:
              key = hashlib.pbkdf2_hmac('sha256', password.encode(), base64.b64decode(payload['salt']), payload['iterations'], 32)
              clear = AESGCM(key).decrypt(base64.b64decode(payload['nonce']),base64.b64decode(payload['ciphertext']),b'scfl-data-v1')
              data = json.loads(clear)
              if not data.get('seasons') or not data.get('currentStandings'):
                  print('SITE_DATA_STRUCTURE_INVALID')
              else:
                  print('SITE_PASSWORD_DECRYPTS_LIVE_PAYLOAD')
          except Exception:
              print('SITE_PASSWORD_DOES_NOT_DECRYPT_LIVE_PAYLOAD')
          PY
